d" d="M6,6H-6V-6H6Z" transform="translate(20,0)" style="stroke-width: 0.5px; fill: rgb(97, 107, 250); fill-opacity: 1; stroke: rgb(229, 236, 246); stroke-opacity: 1;"/></g></g></g><rect class="legendtoggle" x="0" y="-9.5" width="152.91796875" height="19" style="fill: rgb(0, 0, 0); fill-opacity: 0;"/></g></g></g><rect class="scrollbar" rx="20" ry="3" width="0" height="0" style="fill: rgb(128, 139, 164); fill-opacity: 1;" x="0" y="0"/></g><g class="g-gtitle"><text class="gtitle" x="300" y="20" text-anchor="middle" dy="0.7em" style="opacity: 1; font-family: 'Open Sans', verdana, arial, sans-serif; font-size: 17px; fill: rgb(42, 63, 95); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="300" y="20">Rose des vents des tempêtes</tspan><tspan class="line" dy="1.3em" x="300" y="20">(avec la direction la plus fréquente de chaque tempête)</tspan></text></g><g class="g-polartitle"/><g class="annotation" data-index="0" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,271.5,364.5)"><g class="cursor-pointer" transform="translate(0,350)"><rect class="bg" x="0.5" y="0.5" width="542" height="28" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="start" x="2" y="12" style="font-family: 'Open Sans', verdana, arial, sans-serif; font-size: 10px; fill: rgb(42, 63, 95); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="2" y="12">Une tempête est définie comme un événement avec vents soutenus d'au moins 10 m/s et durant au moins</tspan><tspan class="line" dy="1.3em" x="2" y="12">12h. Les tempêtes avec moins de 24h de temps entre les deux sont combinées.</tspan></text></g></g></g></g></svg>