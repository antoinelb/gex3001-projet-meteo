th="144.92578125" height="21.2" style="fill: rgb(0, 0, 0); fill-opacity: 0;"/></g></g></g><rect class="scrollbar" rx="20" ry="3" width="0" height="0" style="fill: rgb(128, 139, 164); fill-opacity: 1;" x="0" y="0"/></g><g class="g-gtitle"><text class="gtitle" x="300" y="20" text-anchor="middle" dy="0.7em" style="opacity: 1; font-family: 'Playfair Display'; font-size: 20px; fill: rgb(42, 63, 95); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="300" y="20">Rose des vents des tempêtes</tspan><tspan class="line" dy="1.3em" x="300" y="20">(avec la direction la plus fréquente de chaque tempête)</tspan></text></g><g class="g-polartitle"/><g class="annotation" data-index="0" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,241.5,392.5)"><g class="cursor-pointer" transform="translate(0,365)"><rect class="bg" x="0.5" y="0.5" width="482" height="54" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="start" x="2" y="14" style="font-family: 'Playfair Display'; font-size: 14px; fill: rgb(42, 63, 95); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="2" y="14">Une tempête est définie comme un événement avec vents soutenus d'au moins 10 m/s</tspan><tspan class="line" dy="1.3em" x="2" y="14">et durant au moins 12h. Les tempêtes avec moins de 24h de temps entre les deux</tspan><tspan class="line" dy="2.6em" x="2" y="14">sont combinées.</tspan></text></g></g></g></g></svg>